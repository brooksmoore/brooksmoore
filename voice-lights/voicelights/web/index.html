<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Studio Lights</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128161;</text></svg>">
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="dot" id="link-dot" title="connection"></span>
    <h1>Studio</h1>
  </div>
  <div class="bar-actions">
    <button id="help-btn" class="ghost" aria-label="What can I say">?</button>
    <button id="refresh-btn" class="ghost" aria-label="Refresh state">&#8635;</button>
  </div>
</header>

<main>
  <section id="bulbs" class="bulbs" aria-label="Lights"></section>

  <section class="scenes" aria-label="Scenes">
    <div id="scene-chips" class="chips"></div>
  </section>

  <section class="log" aria-live="polite">
    <div id="reply" class="reply"></div>
    <ul id="history" class="history"></ul>
  </section>
</main>

<footer class="mic-area">
  <p id="transcript" class="transcript">Hold to talk</p>

  <div class="mic-row">
    <label class="switch" title="Listen continuously for the wake word">
      <input type="checkbox" id="always-on">
      <span>Always on</span>
    </label>

    <button id="mic" class="mic" aria-label="Hold to talk">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 0 0-7 0v5A3.5 3.5 0 0 0 12 15z"/>
        <path d="M18.5 11.5a6.5 6.5 0 0 1-13 0M12 18v3"/>
      </svg>
      <span class="pulse"></span>
    </button>

    <label class="switch" title="Speak confirmations back">
      <input type="checkbox" id="speak-back">
      <span>Speak</span>
    </label>
  </div>

  <form id="type-form" class="type-row">
    <input id="type-input" type="text" placeholder="or type a command" autocomplete="off"
           autocapitalize="off" spellcheck="false" enterkeyhint="send">
    <button type="submit" class="ghost">Send</button>
  </form>
</footer>

<dialog id="help">
  <h2>Things you can say</h2>
  <div id="help-body"></div>
  <button id="help-close" class="ghost">Close</button>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
